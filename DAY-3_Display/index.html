<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css"/>
    <title>Document</title>
</head>
<body>
    <div class="text-center">
        <h1 class="text-blue-500 text-5xl font-bold">
            BLOCK
        </h1>

        <div class="bg-violet-950 p-4 mx-16 space-y-4">
            <span class="block h-12 bg-green-500 rounded-lg">1</span>
            <span class="block h-12 bg-green-500 rounded-lg">2</span>
            <span class="block h-12 bg-green-500 rounded-lg">3</span>
        </div>

    </div>
    <br/>
    <div class="text-center">
        <h1 class="text-blue-500 text-5xl font-bold">Inline-Block</h1>

        <div class="bg-violet-950 p-4 mx-16 space-h-4">
            <span class="inline-block w-32 h-12 bg-green-600 rounded-lg">1</span>
            <span class="inline-block w-32 h-12 bg-green-600 rounded-lg">2</span>
            <span class="inline-block w-32 h-12 bg-green-600 rounded-lg">3</span>
        </div>
    </div>

    <br/>
    <div class="text-center">
        <h1 class="text-cyan-900 text-5xl font-bold">inline</h1>
        <div class="bg-cyan-900 p-4 mx-16 space-v-4">
            <span class="inline w-12 h-10 bg-indigo-950 rounded-lg">1</span>
            <span class="inline w-12 h-10 bg-indigo-950 rounded-lg">2</span>
            <span class="inline w-12 h-10 bg-indigo-950 rounded-lg">3</span>
        </div>
    </div>
    <br/>
    <div class="text-center">
        <h1 class="text-cyan-900 text-5xl font-bold">flex</h1>
        <div class="flex bg-fuchsia-950 text-yellow-50 text-5xl font-bold  p-4 mx-16 space-h-5 gap-x-4">
            <span class="flex-1 w-10 h-12 bg-slate-900 rounded-lg">1</span>
            <span class="flex-1 w-10 h-12 bg-slate-900 rounded-lg">2</span>
            <span class="flex-1 w-10 h-12 bg-slate-900 rounded-lg">3</span>
        </div>
    </div>
</body>
</html>
